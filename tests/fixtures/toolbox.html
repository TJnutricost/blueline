<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blueline toolbox fixtures</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #222; }
  section { margin: 0 0 32px; padding: 20px 40px; }
  /* Hero: white heading on a dark band */
  .hero { background: #12233f; padding: 40px; }
  .hero-title { margin: 0; font-size: 24px; color: #ffffff; }
  .lead { margin: 8px 0 0; color: #c9d2e6; }
  /* Three cards sharing the same classes */
  .cards { display: flex; gap: 20px; }
  .card { width: 220px; border: 1px solid #ddd; border-radius: 8px; padding: 12px; }
  .card-title { margin: 0 0 6px; font-size: 18px; }
  .card-price { margin: 0; font-weight: 600; }
  /* A button with an icon inside (has child elements) */
  /* Offset from the left edge so a 220px card can be placed to the left of it without leaving the page. */
  .cta { margin-left: 260px; display: inline-flex; gap: 6px; background: #e5239d; color: #fff; padding: 10px 18px; border-radius: 6px; border: 0; }
</style>
</head>
<body>
  <section class="hero" id="hero">
    <h2 class="hero-title" id="hero-h">Summer sale</h2>
    <p class="lead" id="lead">Everything ships free this week.</p>
  </section>
  <section id="grid">
    <div class="cards">
      <div class="card" id="c1"><h3 class="card-title" data-t="t1">Whey protein</h3><p class="card-price" data-t="p1">$29.99</p></div>
      <div class="card" id="c2"><h3 class="card-title" data-t="t2">Creatine</h3><p class="card-price" data-t="p2">$19.99</p></div>
      <div class="card" id="c3"><h3 class="card-title" data-t="t3">Magnesium</h3><p class="card-price" data-t="p3">$12.99</p></div>
    </div>
  </section>
  <section>
    <button class="cta" id="cta"><span class="cta-icon">★</span><span class="cta-label">Shop now</span></button>
  </section>
</body>
</html>
